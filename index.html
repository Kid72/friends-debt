<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dostlar Xərcləri - Friends Expense Tracker</title>
    <meta name="description" content="Dostlar üçün xərc və borc hesablama PWA" />
    <meta name="theme-color" content="#006A60" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DostBorc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" id="app-manifest" href="/api/manifest" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var room = params.get('room');
          if (!room) {
            try {
              room = localStorage.getItem('friends_debt_last_room');
            } catch (err) {}
          }
          var manifest = document.getElementById('app-manifest');
          if (room && manifest) {
            manifest.href = '/api/manifest?room=' + encodeURIComponent(room);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500;700&family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-md-background text-md-on-background font-sans antialiased selection:bg-md-primary-container selection:text-md-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
